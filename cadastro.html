<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | SkyPass</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="register-page">

        <section class="register-card">
            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                <h1>
                    Sky<span>Pass</span>
                </h1>

            </div>

            <div class="register-introduction">

                <h2>Crie sua conta</h2>

                <p>
                    Comece a planejar suas próximas viagens.
                </p>

            </div>
            <form>
                <div class="input-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>
                <div class="input-group">

                    <label for="email-cadastro">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email-cadastro"
                        placeholder="seu@email.com"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="senha-cadastro">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha-cadastro"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        placeholder="Repita sua senha"
                        required
                    >

                </div>
                <label class="terms">

                    <input type="checkbox" required>

                    <span>
                        Concordo com os termos de uso e
                        política de privacidade.
                    </span>

                </label>

                <button
                    type="submit"
                    class="register-button"
                >
                    Criar minha conta
                </button>

            </form>

            <p class="back-login">

                Já possui uma conta?

                <a href="login.html">
                    Entrar
                </a>

            </p>

        </section>

    </main>

</body>

</html>
