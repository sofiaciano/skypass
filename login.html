<DOCTYPE html>
<htm!l lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkyPass</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">
            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                <h1>
                    Sky<span>Pass</span>
                </h1>

            </div>
            <div class="login-introduction">

                <h2>Bem-vindo!</h2>

                <p>
                    Conectamos você ao seu destino.
                </p>

            </div>
            <form>
                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seu@email.com"
                        required
                    >

                </div>
                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>
                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox">

                        <span>
                            Lembrar-me
                        </span>

                    </label>


                    <a href="#">
                        Esqueceu a senha?
                    </a>

                </div>
                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>

            </form>
            <div class="divider">

                <span>
                    ou continue com
                </span>

            </div>
            <div class="social-buttons">

                <button type="button">

                    <strong>
                        G
                    </strong>

                    Google

                </button>


                <button type="button">

                    <strong>
                        ●
                    </strong>

                    Apple

                </button>

            </div>
            <p class="create-account">

                Ainda não tem uma conta?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </section>

    </main>

</body>

</html>
